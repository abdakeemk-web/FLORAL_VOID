<!--meta {"title": "Fursuit Gallery | Heads, Partials, Full Suits and Furry Work | FLORAL VOID", "description": "Browse custom fursuit and furry work by FLORAL VOID, sorted into heads, partials, full suits, furry pieces and work in progress."} -->
<main id="main">
  <section class="page-wrap gallery-page">
    <p class="eyebrow">Portfolio</p>
    <h1 class="h1">Fursuit Gallery</h1>
    <p class="lead">A selection of fursuit work. Choose a type to filter, or tap any photo to see it larger.</p>

    <div class="filters" role="group" aria-label="Filter the gallery by type">{{galleryFilters}}</div>
    <p class="gallery-status" role="status" aria-live="polite"></p>
    <p class="gallery-empty" hidden>No photos in this category yet — check back soon.</p>

    <ul class="gallery-grid">
{{galleryTiles}}
    </ul>

    <p class="more">Like what you see? <a class="btn btn-gold" href="/contact">Request a commission</a></p>
  </section>

  <dialog class="lightbox" aria-label="Enlarged photo or video">
    <button class="lightbox-close" type="button" aria-label="Close viewer">&times;</button>
    <button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous item">&#8249;</button>
    <figure class="lightbox-figure">
      <img class="lightbox-image" alt="">
      <video class="lightbox-video" controls playsinline preload="none" hidden></video>
      <figcaption class="lightbox-caption"></figcaption>
    </figure>
    <button class="lightbox-nav lightbox-next" type="button" aria-label="Next item">&#8250;</button>
  </dialog>
  <script defer src="/js/gallery.js"></script>
</main>
